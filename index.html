<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Casa de Cange</title>
</head>
<body>
    <section class="carousel">
      <div class="logos">
        <img decoding="async"
          src="./img/destacada-1.jpg"
          alt=""
        />
        <img decoding="async"
          src="./img/destacada-2.jpg"
          alt=""
        />
        <img decoding="async"
          src="./img/destacada-3.jpg"
          alt=""
        />
        <img decoding="async"
          src="./img/destacada-4.jpg"
          alt=""
        />
        <img decoding="async"
          src="./img/destacada-5.jpg"
          alt=""
        />
      </div>

      <div
        class="logos"
        aria-hidden
      >
        <img decoding="async"
          src="./img/destacada-1.jpg"
          alt=""
        />
        <img decoding="async"
          src="./img/destacada-2.jpg"
          alt=""
        />
        <img decoding="async"
          src="./img/destacada-3.jpg"
          alt=""
        />
        <img decoding="async"
          src="./img/destacada-4.jpg"
          alt=""
        />
        <img decoding="async"
          src="./img/destacada-5.jpg"
          alt=""
        />
      </div>
    </section>


    <script src="script.js"></script>
</body>
</html>
